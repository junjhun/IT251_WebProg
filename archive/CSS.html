<!-- 
    3 Types of CSS
    1. Inline
    2. Internal
    3. External

    Hierarchy of CSS
    Inline > Internal > External

    Selectors
    1. Tags - p, body
    2. Classes - .classname
    3. IDs - #idname
    4. Attributes - [attribute="value"]
    5. *

    Box Model:
    1. Margin
    2. Border
    3. Padding
    4. Content

 -->

 <!DOCTYPE html>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* body {

        p {
            border: 1px solid black;
            /* border-top: 5px solid black; */
            /* border-width: 1px 5px 8px 15px; */
            color: blue;
            font-size: 20px;
            padding: 10px 15px;
        }

        body{

            background-color: lightgray;
            color: #334133;
            line-height: 1.6;
        }

        #main-nav {
            background-color: #1e293b;
            color: white;
            padding: 15px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav ul {
            list-style-type: none;
            display: flex;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: color 2s, font-size 4s;
        }

        nav a:hover {
            color: violet;
            font-size: 67px;
        }

        .profile-card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: 20px auto;
        }

        .login {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: 20px auto;
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            display: flex;
            flex-direction: column;
        }

        .login_button {
            background-color: #1e293b;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        .login_span {
            display: flex;
            justify-content: center;
        }

    </style>
    <link rel="stylesheet" href="mystyles.css">
    <link rel="stylesheet" href="mycss.css">
 </head>
